# ============================================================================
# Experiment Configuration: EMT Dataset - Setting 6 (Start-Peak-Reversal)
# ============================================================================
# This file orchestrates the complete experiment by referencing other configs.

# Experiment metadata
experiment:
  name: "EMT_Cook_Setting6_StartPeakReversal"
  description: "Train models on 3 timepoints (0d, 7d, 3d_rm) - Start, peak, and reversal endpoint"
  version: "1.0"
  author: "Shi Pan"
  date: "2024-11-16"

# Configuration file references
configs:
  data: "data_EMT_Cook_with_label.yaml"
  models: "models_default.yaml"
  analyzer: "analyzer_default.yaml"

# Data setting selection
data_setting: "setting6"  # Use setting6 from data config

# Data sampling override (experiment-specific)
data_sampling_override:
  total_cells: 6000  # 3 timepoints × 2000 = 6000 total samples

# Models to train for this experiment
models_to_train:
  - name: "sb_mlplus"
    enabled: true
    override_params:
      training:
        epochs: 200
        batch_size: 64
  
  - name: "batch_ot"
    enabled: true
    override_params:
      training:
        epochs: 200
        batch_size: 128
  
  - name: "vae"
    enabled: true
    override_params:
      training:
        epochs: 200  
        batch_size: 128

# Experiment-specific settings
settings:
  # Random seed for reproducibility
  seed: 42
  
  # Device configuration
  device: "cuda"
  
  # Multi-GPU settings
  multi_gpu:
    enabled: false
    device_ids: [0, 1]
    strategy: "ddp"
  
  # Number of workers for data loading
  num_workers: 4
  
  # Mixed precision training
  mixed_precision:
    enabled: false
    dtype: "float16"
  
  # Output directory
  output_dir: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/SynthaticSCData/EMT_Setting6"
  
  # Subdirectories
  subdirs:
    checkpoints: "checkpoints"
    logs: "logs"
    visualizations: "visualizations"
    metrics: "metrics"
    generated_data: "generated_data"
  
  # Logging
  logging:
    console_level: "INFO"
    file_level: "DEBUG"
    log_file: "experiment.log"
    
    wandb:
      enabled: false
      project: "SynthaticSCData"
      entity: null
      tags: ["EMT", "Setting6", "StartPeakReversal"]
      notes: "Start, peak EMT, and reversal endpoint trajectory"
    
    tensorboard:
      enabled: true
      log_dir: "tensorboard"
  
  # Checkpointing
  checkpoint:
    save_frequency: 10
    keep_last_n: 3
    save_best: true
    save_optimizer: true
    save_scheduler: true

# Evaluation settings for this experiment
evaluation:
  eval_during_training: true
  eval_frequency: 5
  eval_on_test: true
  
  compute_metrics: true
  generate_visualizations: true
  save_generated_samples: true
  
  n_samples_per_model: 1000
  
  # Trajectory settings (specific to Setting 6)
  trajectory:
    n_intermediate_points: 20  # Points between each consecutive time pair
    save_full_trajectory: true
    analyze_per_segment: true  # Analyze each time segment separately
    
  # Evaluation endpoints (for Setting 6: 0d -> 3d_rm)
  start_timepoint: "0d"
  end_timepoint: "3d_rm"

# Post-training analysis
post_analysis:
  enabled: true
  
  tasks:
    - name: "trajectory_analysis"
      description: "Analyze trajectory through peak to reversal"
      enabled: true
    
    - name: "temporal_consistency"
      description: "Check temporal consistency of generated trajectories"
      enabled: true
    
    - name: "gene_expression_dynamics"
      description: "Analyze gene expression dynamics over time"
      enabled: true
    
    - name: "peak_reversal_analysis"
      description: "Analyze transition from peak EMT to reversal"
      enabled: true
    
    - name: "generate_report"
      description: "Generate comprehensive HTML report"
      enabled: true

# Resource limits
resources:
  max_memory_gb: 32
  max_time_hours: 24
  
# Error handling
error_handling:
  continue_on_error: false
  save_on_error: true
  send_notification: false
  notification_email: null
