# ============================================================================
# Experiment Configuration: GSE234181 Dataset - Setting 1 (Boundary Only)
# ============================================================================
# This experiment trains SB, OT, and VAE models on boundary time points (T0, T3)
# for the GSE234181 dormancy-awakening dataset

experiment:
  name: "GSE234181_Setting1_Boundary"
  description: "Train SB, OT, and VAE models on boundary time points (T0, T3) only"
  dataset: "GSE234181"
  version: "1.0"
  tags:
    - "dormancy"
    - "awakening"
    - "boundary_interpolation"
    - "setting1"

# Reference to other configuration files
configs:
  data: "data_GSE234181.yaml"
  models: "models_default.yaml"
  analyzer: "analyzer_default.yaml"

# Data setting selection
data_setting: "setting1"  # Use setting1 from data config

# Models to train for this experiment
models_to_train:
  - name: "sb"
    enabled: true
    override_params:
      training:
        epochs: 150  # Override default if needed
  
  - name: "ot"
    enabled: true
    override_params: null
  
  - name: "vae"
    enabled: true
    override_params: null

# Experiment-specific settings
settings:
  # Random seed for reproducibility
  seed: 42
  
  # Device configuration
  device: "cuda"  # Options: cuda, cpu, cuda:0, cuda:1, etc.
  
  # Multi-GPU settings
  multi_gpu:
    enabled: false
    device_ids: [0, 1]
    strategy: "ddp"  # Options: ddp, dp
  
  # Number of workers for data loading
  num_workers: 4
  
  # Mixed precision training
  mixed_precision:
    enabled: false
    dtype: "float16"  # Options: float16, bfloat16
  
  # Output directory
  output_dir: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/SynthaticSCData/GSE234181_Setting1"
  
  # Subdirectories
  subdirs:
    checkpoints: "checkpoints"
    logs: "logs"
    visualizations: "visualizations"
    metrics: "metrics"
    generated_data: "generated_data"
  
  # Logging
  logging:
    console_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
    file_level: "DEBUG"
    log_file: "experiment.log"
    
    # Weights & Biases integration
    wandb:
      enabled: false
      project: "synthaticscdata"
      entity: null  # Your W&B username/team
      run_name: "GSE234181_setting1"
      tags: ["GSE234181", "setting1", "boundary"]
    
    # TensorBoard
    tensorboard:
      enabled: true
      log_dir: "tensorboard"

# Evaluation settings
evaluation:
  # Metrics to compute
  compute_metrics: true
  
  # Save generated trajectories
  save_trajectories: true
  
  # Trajectory generation settings
  trajectory:
    n_steps: 100  # Number of time steps for trajectory
    n_samples: 1000  # Number of samples to generate
  
  # Comparison with ground truth
  compare_with_ground_truth: true

# Post-training analysis
analysis:
  # Generate comparison plots
  generate_plots: true
  
  # Dimensionality reduction for visualization
  dim_reduction:
    methods: ["umap", "pca"]
    n_components: 2
  
  # Statistical tests
  statistical_tests:
    enabled: true
    methods: ["t_test", "wilcoxon"]
  
  # Gene-level analysis
  gene_analysis:
    enabled: true
    top_genes: 50  # Number of top genes to analyze

# Resource limits
resources:
  max_memory_gb: 32  # Maximum memory usage
  timeout_hours: 24  # Maximum runtime

# Error handling
error_handling:
  continue_on_model_failure: true  # Continue training other models if one fails
  save_on_error: true  # Save partial results on error
  max_retries: 0  # Number of retries on failure
