# ============================================================================
# Experiment Configuration: EMT Dataset - Setting 5 (Boundary with Reversal Endpoint)
# ============================================================================
# This file orchestrates the complete experiment by referencing other configs.

# Experiment metadata
experiment:
  name: "EMT_Cook_Setting5_BoundaryWithReversal"
  description: "Train models on 2 boundary timepoints (0d, 3d_rm) - Start to reversal endpoint"
  version: "1.0"
  author: "Shi Pan"
  date: "2024-11-16"

# Configuration file references
configs:
  data: "data_EMT_Cook_with_label.yaml"
  models: "models_default.yaml"
  analyzer: "analyzer_default.yaml"

# Data setting selection
data_setting: "setting5"  # Use setting5 from data config

# Data sampling override (experiment-specific)
# Auto-updated from step0_calculate_data_split_params.py results
data_sampling_override:
  cells_per_timepoint: 4487  # Updated: 2024-11-18
  # Setting5: 2 timepoints × 4,487 = 8,974 total samples
  # 
  # Rationale:
  # - Bottleneck: 0d with 4,487 available cells (100.0% usage)
  # - Fair comparison: Group2 (setting4,5,6) all use 8,974 total samples
  # - Sufficient for convergence: each category has ≥1000 samples

# Models to train for this experiment
# Setting5 is a boundary setting (like Setting1), so use basic models
models_to_train:
  - name: "sb"
    enabled: true
    override_params:
      training:
        epochs: 150
  
  - name: "ot"
    enabled: true
    override_params: null
  
  - name: "vae"
    enabled: true
    override_params: null

# Experiment-specific settings
settings:
  # Random seed for reproducibility
  seed: 42
  
  # Device configuration
  device: "cuda"
  
  # Multi-GPU settings
  multi_gpu:
    enabled: false
    device_ids: [0, 1]
    strategy: "ddp"
  
  # Number of workers for data loading
  num_workers: 4
  
  # Mixed precision training
  mixed_precision:
    enabled: false
    dtype: "float16"
  
  # Output directory
  output_dir: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/SynthaticSCData/EMT_Part2_Setting2"
  
  # Subdirectories
  subdirs:
    checkpoints: "checkpoints"
    logs: "logs"
    visualizations: "visualizations"
    metrics: "metrics"
    generated_data: "generated_data"
  
  # Logging
  logging:
    console_level: "INFO"
    file_level: "DEBUG"
    log_file: "experiment.log"
    
    wandb:
      enabled: false
      project: "SynthaticSCData"
      entity: null
      tags: ["EMT", "Setting5", "BoundaryReversal"]
      notes: "Boundary timepoints with reversal endpoint"
    
    tensorboard:
      enabled: true
      log_dir: "tensorboard"
  
  # Checkpointing
  checkpoint:
    save_frequency: 10
    keep_last_n: 3
    save_best: true
    save_optimizer: true
    save_scheduler: true

# Evaluation settings for this experiment
evaluation:
  eval_during_training: true
  eval_frequency: 5
  eval_on_test: true
  
  compute_metrics: true
  generate_visualizations: true
  save_generated_samples: true
  
  n_samples_per_model: 1000
  
  # Trajectory settings (specific to Setting 5)
  trajectory:
    n_intermediate_points: 20  # Points between the two timepoints
    save_full_trajectory: true
    analyze_per_segment: false  # Only one segment
    
  # Evaluation endpoints (for Setting 5: 0d -> 3d_rm)
  start_timepoint: "0d"
  end_timepoint: "3d_rm"

# Post-training analysis
post_analysis:
  enabled: true
  
  tasks:
    - name: "trajectory_analysis"
      description: "Analyze trajectory from start to reversal endpoint"
      enabled: true
    
    - name: "temporal_consistency"
      description: "Check temporal consistency of generated trajectory"
      enabled: true
    
    - name: "gene_expression_dynamics"
      description: "Analyze gene expression dynamics over time"
      enabled: true
    
    - name: "generate_report"
      description: "Generate comprehensive HTML report"
      enabled: true

# Resource limits
resources:
  max_memory_gb: 32
  max_time_hours: 24
  
# Error handling
error_handling:
  continue_on_error: false
  save_on_error: true
  send_notification: false
  notification_email: null
