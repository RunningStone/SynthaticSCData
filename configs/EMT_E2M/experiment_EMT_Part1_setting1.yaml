# ============================================================================
# Experiment Configuration: EMT Dataset - Setting 1 (Boundary Only)
# ============================================================================
# This file orchestrates the complete experiment by referencing other configs.

# Experiment metadata
experiment:
  name: "EMT_Cook_Setting1_Boundary"
  description: "Train SB, OT, and VAE models on boundary time points (0d, 7d) only"
  version: "1.0"
  author: "Shi Pan"
  date: "2024-11-14"

# Configuration file references
configs:
  data: "data_EMT_Cook_with_label.yaml"
  models: "models_default.yaml"
  analyzer: "analyzer_default.yaml"

# Data setting selection
data_setting: "setting1"  # Use setting1 from data config

# Data sampling override (experiment-specific)
# Override the default sampling parameters from data config
# Auto-updated from step0_calculate_data_split_params.py results
data_sampling_override:
  cells_per_timepoint: 4487  # Updated: 2024-11-18
  # Setting1: 2 timepoints × 4,487 = 8,974 total samples
  # 
  # Rationale:
  # - Bottleneck: 0d with 4,487 available cells (100.0% usage)
  # - Fair comparison: Group1 (setting1,2,3) all use 8,974 total samples
  # - Sufficient for convergence: each category has ≥1000 samples

# Models to train for this experiment
models_to_train:
  - name: "sb"
    enabled: true
    override_params:
      training:
        epochs: 150  # Override default if needed
  
  - name: "ot"
    enabled: true
    override_params: null
  
  - name: "vae"
    enabled: true
    override_params: null

# Experiment-specific settings
settings:
  # Random seed for reproducibility
  seed: 42
  
  # Device configuration
  device: "cuda"  # Options: cuda, cpu, cuda:0, cuda:1, etc.
  
  # Multi-GPU settings
  multi_gpu:
    enabled: false
    device_ids: [0, 1]
    strategy: "ddp"  # Options: ddp, dp
  
  # Number of workers for data loading
  num_workers: 4
  
  # Mixed precision training
  mixed_precision:
    enabled: false
    dtype: "float16"  # Options: float16, bfloat16
  
  # Output directory
  output_dir: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/SynthaticSCData/EMT_Part1_Setting1"
  
  # Subdirectories
  subdirs:
    checkpoints: "checkpoints"
    logs: "logs"
    visualizations: "visualizations"
    metrics: "metrics"
    generated_data: "generated_data"
  
  # Logging
  logging:
    console_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
    file_level: "DEBUG"
    log_file: "experiment.log"
    
    # Weights & Biases integration
    wandb:
      enabled: false
      project: "SynthaticSCData"
      entity: null
      tags: ["EMT", "Setting1", "Boundary"]
      notes: "Boundary interpolation experiment"
    
    # TensorBoard integration
    tensorboard:
      enabled: true
      log_dir: "tensorboard"
  
  # Checkpointing
  checkpoint:
    save_frequency: 10  # Save every N epochs
    keep_last_n: 3  # Keep last N checkpoints
    save_best: true
    save_optimizer: true
    save_scheduler: true

# Evaluation settings for this experiment
evaluation:
  # When to evaluate
  eval_during_training: true
  eval_frequency: 5  # Evaluate every N epochs
  eval_on_test: true
  
  # What to evaluate
  compute_metrics: true
  generate_visualizations: true
  save_generated_samples: true
  
  # Number of samples to generate
  n_samples_per_model: 1000
  
  # Interpolation settings (specific to Setting 1)
  interpolation:
    n_intermediate_points: 50  # Number of points between 0d and 7d
    save_trajectory: true

# Post-training analysis
post_analysis:
  enabled: true
  
  tasks:
    - name: "model_comparison"
      description: "Compare all trained models"
      enabled: true
    
    - name: "trajectory_analysis"
      description: "Analyze generated trajectories"
      enabled: true
    
    - name: "gene_expression_analysis"
      description: "Analyze gene expression patterns"
      enabled: true
    
    - name: "generate_report"
      description: "Generate comprehensive HTML report"
      enabled: true

# Resource limits
resources:
  max_memory_gb: 32  # Maximum memory usage (warning if exceeded)
  max_time_hours: 24  # Maximum experiment time (stop if exceeded)
  
# Error handling
error_handling:
  continue_on_error: false  # Continue training other models if one fails
  save_on_error: true  # Save checkpoint if training crashes
  send_notification: false  # Send notification on completion/error
  notification_email: null
