# Real Data Interpolation Configuration
data:
  adata_path: "/home/pan/Experiments/EXPs/2024_EMT_LM_workspace/EMT-LM_Data/Step_0_data/preprocessed/GSE147405_Cook/2024_12_04_Cook_emt_dataset_with_removal_scBERT.h5ad"
  time_label_key: "Ground_truth"
  time_labels_order: ["0d", "8h", "1d", "3d", "7d"]
  time_intervals:
    "0d-8h": 8
    "8h-1d": 16
    "1d-3d": 48
    "3d-7d": 96
  target_time_range: [0, 168]
  time_granularity: 1.0
  n_hvg: 100
  cells_per_timepoint: 2000
  noise_scale: 0.1
  random_seed: 42

dataset:
  sampling_mode: "all_timeslices"
  train_ratio: 0.8

models:
  ot:
    hidden_dims: [256, 256, 256]
  sb:
    hidden_dims: [512, 512, 512]
    time_embedding_dim: 64
  vae:
    encoder_dims: [256, 128]
    latent_dim: 32
    decoder_dims: [128, 256]

training:
  ot:
    epochs: 100
    batch_size: 128
  sb:
    epochs: 200
    batch_size: 64
  vae:
    epochs: 150
    batch_size: 128

evaluation:
  n_samples: 1000
  metrics: ['mae', 'pcc', 'entropy', 'frechet']

experiment:
  output_dir: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/real_data_experiment"
