# ============================================================================
# Experiment Configuration: GSE234181 Dataset - Setting 2 (All Time Points)
# ============================================================================
# This experiment trains MLPlus SB model on all time points (T0, T1, T2, T3)
# for the GSE234181 dormancy-awakening dataset

experiment:
  name: "GSE234181_Setting2_AllTimePoints"
  description: "Train MLPlus SB model on all time points (T0, T1, T2, T3)"
  dataset: "GSE234181"
  version: "1.0"
  tags:
    - "dormancy"
    - "awakening"
    - "full_trajectory"
    - "setting2"

# Reference to other configuration files
configs:
  data: "data_GSE234181.yaml"
  models: "models_default.yaml"
  analyzer: "analyzer_default.yaml"

# Data setting selection
data_setting: "setting2"  # Use setting2 from data config

# Models to train for this experiment
# Setting 2 typically uses MLPlus SB which can handle multiple time points
models_to_train:
  - name: "sb_mlplus"
    enabled: true
    override_params:
      training:
        epochs: 200  # More epochs for complex trajectory learning
        batch_size: 128

# Experiment-specific settings
settings:
  # Random seed for reproducibility
  seed: 42
  
  # Device configuration
  device: "cuda"  # Options: cuda, cpu, cuda:0, cuda:1, etc.
  
  # Multi-GPU settings
  multi_gpu:
    enabled: false
    device_ids: [0, 1]
    strategy: "ddp"  # Options: ddp, dp
  
  # Number of workers for data loading
  num_workers: 4
  
  # Mixed precision training
  mixed_precision:
    enabled: false
    dtype: "float16"  # Options: float16, bfloat16
  
  # Output directory
  output_dir: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/SynthaticSCData/GSE234181_Setting2"
  
  # Subdirectories
  subdirs:
    checkpoints: "checkpoints"
    logs: "logs"
    visualizations: "visualizations"
    metrics: "metrics"
    generated_data: "generated_data"
  
  # Logging
  logging:
    console_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
    file_level: "DEBUG"
    log_file: "experiment.log"
    
    # Weights & Biases integration
    wandb:
      enabled: false
      project: "synthaticscdata"
      entity: null  # Your W&B username/team
      run_name: "GSE234181_setting2"
      tags: ["GSE234181", "setting2", "all_timepoints"]
    
    # TensorBoard
    tensorboard:
      enabled: true
      log_dir: "tensorboard"

# Evaluation settings
evaluation:
  # Metrics to compute
  compute_metrics: true
  
  # Save generated trajectories
  save_trajectories: true
  
  # Trajectory generation settings
  trajectory:
    n_steps: 100  # Number of time steps for trajectory
    n_samples: 1000  # Number of samples to generate
    
    # Intermediate time points for evaluation
    evaluate_intermediate: true  # Evaluate at T1 and T2
  
  # Comparison with ground truth
  compare_with_ground_truth: true
  
  # Time point-specific evaluation
  per_timepoint_metrics: true

# Post-training analysis
analysis:
  # Generate comparison plots
  generate_plots: true
  
  # Dimensionality reduction for visualization
  dim_reduction:
    methods: ["umap", "pca"]
    n_components: 2
    
    # Plot trajectory evolution
    plot_trajectory: true
    highlight_timepoints: true
  
  # Statistical tests
  statistical_tests:
    enabled: true
    methods: ["t_test", "wilcoxon"]
  
  # Gene-level analysis
  gene_analysis:
    enabled: true
    top_genes: 50  # Number of top genes to analyze
    
    # Temporal gene expression patterns
    temporal_patterns: true
  
  # Trajectory analysis
  trajectory_analysis:
    enabled: true
    
    # Velocity analysis
    compute_velocity: true
    
    # Transition probabilities
    transition_matrix: true
    
    # Pseudotime alignment
    pseudotime_correlation: true

# Resource limits
resources:
  max_memory_gb: 32  # Maximum memory usage
  timeout_hours: 48  # Maximum runtime (longer for Setting 2)

# Error handling
error_handling:
  continue_on_model_failure: true  # Continue training other models if one fails
  save_on_error: true  # Save partial results on error
  max_retries: 0  # Number of retries on failure
