# ============================================================================
# Data Configuration: GSE234181 Dataset
# ============================================================================
# This file defines the data source, label mappings, and setting-specific
# configurations for training/testing data splits.
#
# GSE234181: Dormancy and awakening trajectory
# T0 → T1 → T2 → T3 (Dormancy to Awakening)

# Raw data file information
data_source:
  file_path: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/DATAs/GSE234181/GSE234181_with_label.h5ad"
  obs_time_column: "time_label"  # Column name in adata.obs for time labels
  
  # Time label order (cells with labels not in this list will be filtered out with warning)
  time_labels_order: ["T0", "T1", "T2", "T3"]
  
  # Time intervals between consecutive time points (in hours)
  # Adjust these based on your experimental design
  time_intervals:
    "T0-T1": 24  # 1 month = ~720 hours, using 24 as placeholder
    "T1-T2": 24  # 1 month = ~720 hours, using 24 as placeholder
    "T2-T3": 24  # Awakening phase, adjust as needed
  
  # Feature selection
  n_hvg: 1000  # Number of highly variable genes to select

# Biology-based train/test split
# Split based on settings column values
biology_split:
  column_name: "settings"  # Column in adata.obs for split
  
  # Train samples
  train_values: [
    "T0_1",      # T0
    "AI1m1",     # T1
    "TAM1m1",    # T1
    "AI1m2",     # T2
    "TAM1m2",    # T2
    "TAMaw1",    # T3
    "TAMaw2",    # T3
    "TAMaw4",    # T3
    "AIaw2",     # T3
    "AIaw3",     # T3
    "AIaw4"      # T3
  ]
  
  # Test samples
  test_values: [
    "T0_2",      # T0
    "AI2m1",     # T1
    "TAM2m1",    # T1
    "AI2m2",     # T2
    "TAM2m2",    # T2
    "TAMaw3",    # T3
    "AIaw1"      # T3
  ]
  
  train_ratio: 0.8  # Only used if column_name is null (random split)

# ============================================================================
# Setting 1: Boundary time points only (T0 and T3)
# ============================================================================
setting1:
  name: "GSE234181-Setting1: Boundary (T0 and T3)"
  description: "Use only the first and last time points: T0 (start) and T3 (awakening)"
  
  # Time points to include
  time_points: ["T0", "T3"]
  
  # Number of cells per time point
  cells_per_timepoint: 11696
  
  # Validation
  min_cells_required: 1000
  
  # Balance strategy
  balance_strategy: "per_timepoint"

# ============================================================================
# Setting 2: All 4 time points (Full trajectory)
# ============================================================================
setting2:
  name: "GSE234181-Setting2: Full Trajectory (All 4 timepoints)"
  description: "Use all available time points: T0 → T1 → T2 → T3"
  
  # Time points to include
  time_points: ["T0", "T1", "T2", "T3"]
  
  # Total cells
  total_cells: 23392
  cells_per_timepoint: 5848
  
  # Validation
  min_cells_required: 500
  
  # Balance strategy
  balance_strategy: "total"

# ============================================================================
# Setting 3: Key time points (T0, T1, T3)
# ============================================================================
setting3:
  name: "GSE234181-Setting3: Key Timepoints (T0, T1, T3)"
  description: "Use key time points: T0 (start), T1 (early dormancy), T3 (awakening)"
  
  # Time points to include
  time_points: ["T0", "T1", "T3"]
  
  # Total cells
  total_cells: 23391
  cells_per_timepoint: 7797
  
  # Validation
  min_cells_required: 500
  
  # Balance strategy
  balance_strategy: "total"

# ============================================================================
# Setting 4: Ablation Studies - Remove ONE intermediate timepoint at a time
# ============================================================================
# Each ablation removes exactly one intermediate timepoint to assess its
# marginal contribution to trajectory learning.

# Ablation 1: Remove T1 timepoint
setting4_ablation_remove_T1:
  name: "GSE234181-Setting4-Ablation: Remove T1"
  description: "Ablation study: remove T1 to assess its marginal contribution"
  time_points: ["T0", "T2", "T3"]
  total_cells: 35088
  cells_per_timepoint: 11696
  min_cells_required: 500
  balance_strategy: "total"

# Ablation 2: Remove T2 timepoint
setting4_ablation_remove_T2:
  name: "GSE234181-Setting4-Ablation: Remove T2"
  description: "Ablation study: remove T2 to assess its marginal contribution"
  time_points: ["T0", "T1", "T3"]
  total_cells: 35088
  cells_per_timepoint: 11696
  min_cells_required: 500
  balance_strategy: "total"

# ============================================================================
# Setting 5: Label Shuffled - Shuffle intermediate timepoint labels
# ============================================================================
setting5_label_shuffled:
  name: "GSE234181-Setting5: Label Shuffled (Intermediate)"
  description: "Shuffle labels among intermediate timepoints: T1, T2"
  
  # Time points to include (all 4)
  time_points: ["T0", "T1", "T2", "T3"]
  
  # Boundary timepoints (labels NOT shuffled)
  boundary_timepoints: ["T0", "T3"]
  
  # Intermediate timepoints (labels TO BE shuffled)
  intermediate_timepoints: ["T1", "T2"]
  
  # Total cells
  total_cells: 46784
  cells_per_timepoint: 11696
  
  # Validation
  min_cells_required: 500
  
  # Balance strategy
  balance_strategy: "total"
  
  # Shuffle parameters
  shuffle_params:
    shuffle_seed: 42
    shuffle_intermediate_only: true

# ============================================================================
# Setting 6: Interpolated - Generate intermediate timepoints
# ============================================================================
setting6_interpolated:
  name: "GSE234181-Setting6: Interpolated Intermediate States"
  description: "Boundary points (T0, T3) are real; intermediate points (T1, T2) are linearly interpolated"
  
  # Time points to include (all 4)
  time_points: ["T0", "T1", "T2", "T3"]
  
  # Total cells
  total_cells: 46784
  cells_per_timepoint: 11696
  
  # Validation
  min_cells_required: 750
  
  # Balance strategy
  balance_strategy: "total"
  
  # Interpolation parameters
  interpolation_params:
    boundary_timepoints: ["T0", "T3"]  # Real data
    intermediate_timepoints: ["T1", "T2"]  # To be interpolated
    n_samples_per_timepoint: 750
    time_to_hours:
      "T0": 0.0
      "T1": 24.0
      "T2": 48.0
      "T3": 72.0

# Data validation settings
validation:
  check_all_timepoints_present: true
  warn_on_filtered_labels: true
  check_sufficient_cells: true
