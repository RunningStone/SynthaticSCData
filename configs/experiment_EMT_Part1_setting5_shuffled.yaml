# ============================================================================
# Experiment Configuration: EMT Dataset - Setting 5 (Shuffled Time Series)
# ============================================================================
# Experiment 5: Time Information Decoupling
# 
# Purpose: Distinguish between two sources of model performance:
#   1. Temporal causal order information (I_causal)
#   2. State space geometric coverage (I_spatial)
#
# Method: Break temporal causal relationships while preserving time interval
#         distribution. Compare performance with Setting 2 (ordered) to quantify
#         the contribution of causal information.
#
# Expected outcomes:
#   - If performance drops significantly: validates time-dependent dynamics learning
#   - If performance maintains: suggests model relies mainly on spatial mapping
#   - Mixed results: different metrics capture different aspects of temporal modeling

# Experiment metadata
experiment:
  name: "EMT_Cook_Setting5_Shuffled"
  description: "Shuffled time series experiment - break causal order but preserve spatial coverage"
  version: "1.0"
  author: "Shi Pan"
  date: "2024-11-18"
  
  # Experiment type flag
  experiment_type: "shuffled_timeseries"  # Special flag for shuffled dataset

# Configuration file references
configs:
  data: "data_EMT_Cook_with_label.yaml"
  models: "models_default.yaml"
  analyzer: "analyzer_default.yaml"

# Data setting selection
data_setting: "setting2"  # Use same timepoints as setting2 for comparison

# Data sampling override (experiment-specific)
data_sampling_override:
  total_cells: 8974  # Same as Setting2 for fair comparison
  use_shuffled_dataset: true  # KEY FLAG: Enable shuffled dataset
  
  # Time points to use (forward EMT only)
  time_points: ["0d", "8h", "1d", "3d", "7d"]
  
  # Time intervals (in hours) - must match data config
  time_intervals:
    "0d-8h": 8
    "8h-1d": 16
    "1d-3d": 48
    "3d-7d": 96
  
  # Shuffling parameters
  shuffle_seed: 42  # For reproducibility
  validate_distribution: true  # Validate Δt distribution matches expected

# Models to train for this experiment
# Use only sb_mlplus for initial test (can add others later)
models_to_train:
  - name: "sb_mlplus"
    enabled: true
    override_params:
      training:
        epochs: 200
        batch_size: 64
        # Same training config as Setting2 for fair comparison

# Experiment-specific settings
settings:
  # Random seed for reproducibility
  seed: 42
  
  # Device configuration
  device: "cuda"
  
  # Multi-GPU settings
  multi_gpu:
    enabled: false
    device_ids: [0]
    strategy: "ddp"
  
  # Number of workers for data loading
  num_workers: 4
  
  # Mixed precision training
  mixed_precision:
    enabled: false
    dtype: "float16"
  
  # Output directory
  output_dir: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/SynthaticSCData/EMT_Part1_Setting5_Shuffled"
  
  # Subdirectories
  subdirs:
    checkpoints: "checkpoints"
    logs: "logs"
    visualizations: "visualizations"
    metrics: "metrics"
    generated_data: "generated_data"
  
  # Logging
  logging:
    console_level: "INFO"
    file_level: "DEBUG"
    log_file: "experiment.log"
    
    wandb:
      enabled: false
      project: "SynthaticSCData"
      entity: null
      tags: ["EMT", "Setting5", "Shuffled", "Experiment5"]
      notes: "Time information decoupling experiment - shuffled time series"
    
    tensorboard:
      enabled: true
      log_dir: "tensorboard"
  
  # Checkpointing
  checkpoint:
    save_frequency: 10
    keep_last_n: 3
    save_best: true
    save_optimizer: true
    save_scheduler: true

# Evaluation settings for this experiment
evaluation:
  eval_during_training: true
  eval_frequency: 5
  eval_on_test: true
  
  compute_metrics: true
  generate_visualizations: true
  save_generated_samples: true
  
  n_samples_per_model: 1000
  
  # Trajectory continuity analysis (NEW for Setting 5)
  compute_trajectory_continuity: true
  trajectory_continuity_samples: 500  # Number of samples for continuity metric
  
  # Trajectory settings
  trajectory:
    n_intermediate_points: 20
    save_full_trajectory: true
    analyze_per_segment: true
  
  # Evaluation on real data (test set uses normal ordering)
  start_timepoint: "0d"
  end_timepoint: "7d"

# Post-training analysis (specific to Setting 5)
post_analysis:
  enabled: true
  
  tasks:
    - name: "causal_vs_spatial_analysis"
      description: "Compare shuffled vs ordered (Setting2) performance"
      enabled: true
      params:
        reference_setting: "EMT_Part1_Setting2"  # Compare with Setting2
        metrics_to_compare:
          - "test_loss"
          - "frechet_distance"
          - "mae"
          - "pcc"
          - "wasserstein_distance"
          - "mmd"
          - "trajectory_continuity"
    
    - name: "trajectory_continuity_analysis"
      description: "Analyze trajectory smoothness and continuity"
      enabled: true
      params:
        compute_jump_distances: true
        visualize_trajectories: true
    
    - name: "time_interval_validation"
      description: "Validate that Δt distribution matches expected"
      enabled: true
      params:
        run_ks_test: true
        alpha: 0.05
        generate_histogram: true
    
    - name: "generate_report"
      description: "Generate comprehensive comparison report"
      enabled: true
      params:
        include_theory: true  # Include theoretical framework explanation
        include_comparison: true  # Include Setting2 comparison

# Resource limits
resources:
  max_memory_gb: 32
  max_time_hours: 48
  
# Error handling
error_handling:
  continue_on_error: false
  save_on_error: true
  send_notification: false
  notification_email: null

# Experiment-specific notes
notes: |
  Experiment 5: Time Information Decoupling
  
  Research Question:
    Does the model truly learn time-dependent dynamics, or does it mainly
    memorize spatial mappings between cell states?
  
  Method:
    - Training: Randomly pair cells while preserving Δt distribution
    - Testing: Evaluate on real ordered data
    - Metric: Compare with Setting2 (ordered) performance
  
  Key Metrics:
    1. Performance degradation: ΔP = P_ordered - P_shuffled
    2. Trajectory continuity ratio: R = J_shuffled / J_ordered
    3. Causal information contribution: C = ΔP / P_ordered × 100%
  
  Interpretation:
    - C > 30%: Time causal information is critical
    - 10% < C < 30%: Time information contributes but not dominant
    - C < 10%: Time information is negligible
  
  Validation:
    - KS test: p > 0.05 (Δt distribution matches expected)
    - All training pairs pre-generated for reproducibility
