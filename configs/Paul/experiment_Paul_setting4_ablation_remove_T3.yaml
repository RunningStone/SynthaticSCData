# ============================================================================
# Experiment Configuration: Paul EMT - Ablation Study (Remove T3)
# ============================================================================
# Experiment 4: Systematic ablation to quantify marginal contribution of T3 timepoint

# Experiment metadata
experiment:
  name: "Paul_EMT_Setting4_Ablation_RemoveT3"
  description: "Ablation study: remove T3 timepoint to assess its marginal contribution"
  version: "1.0"
  author: "Shi Pan"
  date: "2024-12-16"
  parent_experiment: "Paul_EMT_Setting2"
  ablation_target: "T3"

# Configuration file references
configs:
  data: "data_Paul_EMT.yaml"
  models: "models_default.yaml"
  analyzer: "analyzer_default.yaml"

# Data setting selection
data_setting: "setting4_ablation_remove_T3"

# Data sampling override
data_sampling_override:
  total_cells: 1050  # 7 timepoints × 150 = 1,050 cells

# Models to train (only sb_mlplus to save computation)
models_to_train:
  - name: "sb_mlplus"
    enabled: true
    override_params:
      training:
        epochs: 200
        batch_size: 64

# Experiment-specific settings
settings:
  seed: 42
  device: "cuda"
  multi_gpu:
    enabled: false
  num_workers: 4
  mixed_precision:
    enabled: false
  
  output_dir: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/SynthaticSCData/Paul_Setting4_Ablation_RemoveT3"
  
  subdirs:
    checkpoints: "checkpoints"
    logs: "logs"
    visualizations: "visualizations"
    metrics: "metrics"
    generated_data: "generated_data"
  
  logging:
    console_level: "INFO"
    file_level: "DEBUG"
    log_file: "experiment.log"
    wandb:
      enabled: false
    tensorboard:
      enabled: true
      log_dir: "tensorboard"
  
  checkpoint:
    save_frequency: 10
    keep_last_n: 3
    save_best: true
    save_optimizer: true
    save_scheduler: true

# Evaluation settings
evaluation:
  eval_during_training: true
  eval_frequency: 5
  eval_on_test: true
  compute_metrics: true
  generate_visualizations: true
  save_generated_samples: true
  n_samples_per_model: 500
  
  start_timepoint: "T0"
  end_timepoint: "T7"
  
  trajectory:
    n_intermediate_points: 20
    save_full_trajectory: true
    analyze_per_segment: true

# Post-training analysis
post_analysis:
  enabled: true
  tasks:
    - name: "ablation_impact_analysis"
      description: "Analyze the impact of removing T3 timepoint"
      enabled: true
    - name: "generate_report"
      description: "Generate ablation study report"
      enabled: true

# Resource limits
resources:
  max_memory_gb: 16
  max_time_hours: 12

# Error handling
error_handling:
  continue_on_error: false
  save_on_error: true
  send_notification: false
  notification_email: null
