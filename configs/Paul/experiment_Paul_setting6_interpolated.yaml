# ============================================================================
# Experiment Configuration: Paul EMT Dataset - Setting 6 (Interpolated Data)
# ============================================================================
# This experiment trains models on linearly interpolated intermediate states
# to test whether geometric interpolation can replace real observations

# Experiment metadata
experiment:
  name: "Paul_EMT_Setting6_Interpolated"
  description: "Train models on boundary (real) + interpolated intermediate time points (T1-T6)"
  version: "1.0"
  author: "Shi Pan"
  date: "2024-12-16"

# Configuration file references
configs:
  data: "data_Paul_EMT.yaml"
  models: "models_default.yaml"
  analyzer: "analyzer_default.yaml"

# Data setting selection
data_setting: "setting6_interpolated"

# Models to train for this experiment
models_to_train:
  - name: "sb_mlplus"
    enabled: true
    override_params:
      training:
        epochs: 200
        batch_size: 64
  
  - name: "batch_ot"
    enabled: true
    override_params:
      training:
        epochs: 150
        batch_size: 64
  
  - name: "vae"
    enabled: true
    override_params:
      training:
        epochs: 150
        batch_size: 64
  
  - name: "ot"
    enabled: true
    override_params:
      training:
        epochs: 100
        batch_size: 64
  
  - name: "sb"
    enabled: true
    override_params:
      training:
        epochs: 150
        batch_size: 64

# Experiment-specific settings
settings:
  seed: 42
  device: "cuda"
  
  multi_gpu:
    enabled: false
    device_ids: [0, 1]
    strategy: "ddp"
  
  num_workers: 4
  
  mixed_precision:
    enabled: false
    dtype: "float16"
  
  output_dir: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/SynthaticSCData/Paul_Setting6_Interpolated"
  
  subdirs:
    checkpoints: "checkpoints"
    logs: "logs"
    visualizations: "visualizations"
    metrics: "metrics"
    generated_data: "generated_data"
    interpolated_data: "interpolated_data"
  
  logging:
    console_level: "INFO"
    file_level: "DEBUG"
    log_file: "experiment.log"
    
    wandb:
      enabled: false
      project: "SynthaticSCData"
      entity: null
      tags: ["Paul", "Setting6", "Interpolated"]
      notes: "Testing geometric interpolation vs real intermediate states"
    
    tensorboard:
      enabled: true
      log_dir: "tensorboard"
  
  checkpoint:
    save_frequency: 10
    keep_last_n: 3
    save_best: true
    save_optimizer: true
    save_scheduler: true

# Evaluation settings
evaluation:
  eval_during_training: true
  eval_frequency: 5
  eval_on_test: true
  
  compute_metrics: true
  generate_visualizations: true
  save_generated_samples: true
  
  n_samples_per_model: 500
  
  # Interpolation-specific evaluation
  interpolation_analysis:
    enabled: true
    compute_iei: true
    compute_rsi: true
    per_timepoint_analysis: true
    compare_with_setting1: true
    compare_with_setting2: true

# Post-training analysis
post_analysis:
  enabled: true
  
  tasks:
    - name: "interpolation_quality_analysis"
      description: "Analyze quality of interpolated training data"
      enabled: true
    
    - name: "comparison_with_real_intermediate"
      description: "Compare generated data with real intermediate states"
      enabled: true
    
    - name: "residual_structure_analysis"
      description: "Analyze structure in interpolation residuals"
      enabled: true
    
    - name: "generate_report"
      description: "Generate comprehensive HTML report"
      enabled: true

# Resource limits
resources:
  max_memory_gb: 16
  max_time_hours: 24
  
# Error handling
error_handling:
  continue_on_error: false
  save_on_error: true
  send_notification: false
  notification_email: null

# Experiment 6 specific parameters
experiment6_params:
  # Interpolation parameters
  boundary_timepoints: ["T0", "T7"]
  intermediate_timepoints: ["T1", "T2", "T3", "T4", "T5", "T6"]
  n_samples_per_timepoint: 150
  
  # Time mapping (for interpolation weights)
  time_to_hours:
    "T0": 0.0
    "T1": 24.0
    "T2": 48.0
    "T3": 72.0
    "T4": 96.0
    "T5": 120.0
    "T6": 144.0
    "T7": 168.0
  
  # Analysis parameters
  rsi_n_components: 10
  
  # Comparison settings
  setting1_results_path: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/SynthaticSCData/Paul_Setting1"
  setting2_results_path: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/SynthaticSCData/Paul_Setting2"
