# ============================================================================
# Setting 5: Label Shuffled
# ============================================================================
setting5_label_shuffled:
  name: "Label Shuffled"
  description: "Shuffle labels among intermediate timepoints (T1-T6) to test label dependency"
  
  time_points: ["T0", "T1", "T2", "T3", "T4", "T5", "T6", "T7"]
  
  total_cells: 1200
  cells_per_timepoint: null
  
  min_cells_required: 40
  balance_strategy: "total"
  
  # Label shuffling parameters
  shuffle_params:
    boundary_timepoints: ["T0", "T7"]  # Keep original labels
    intermediate_timepoints: ["T1", "T2", "T3", "T4", "T5", "T6"]  # Shuffle these labels

# ============================================================================
# Setting 6: Interpolated Data
# ============================================================================
setting6_interpolated:
  name: "Interpolated Intermediate States"
  description: "Boundary points (T0, T7) are real; intermediate points (T1-T6) are linearly interpolated"
  
  time_points: ["T0", "T1", "T2", "T3", "T4", "T5", "T6", "T7"]
  
  total_cells: 1200  # 8 timepoints × 150 = 1,200 cells
  cells_per_timepoint: null
  
  min_cells_required: 40
  balance_strategy: "total"
  
  # Interpolation parameters
  interpolation_params:
    boundary_timepoints: ["T0", "T7"]  # Real data
    intermediate_timepoints: ["T1", "T2", "T3", "T4", "T5", "T6"]  # To be interpolated
    n_samples_per_timepoint: 150
    time_to_hours:
      "T0": 0.0
      "T1": 24.0
      "T2": 48.0
      "T3": 72.0
      "T4": 96.0
      "T5": 120.0
      "T6": 144.0
      "T7": 168.0

# Data validation settings
validation:
  check_all_timepoints_present: true  # Ensure both train and test have all time points
  warn_on_filtered_labels: true  # Warn if any cells are filtered due to unlisted labels
  check_sufficient_cells: true  # Check min_cells_required for each time point
