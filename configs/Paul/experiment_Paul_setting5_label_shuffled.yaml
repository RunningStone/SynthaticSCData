# ============================================================================
# Experiment Configuration: Paul EMT Dataset - Setting 5 (Label-Shuffled)
# ============================================================================
# Experiment 5: Time Label Randomization
# 
# Purpose: Test whether models rely on absolute time labels or can learn
#          dynamics from data geometry even when labels are randomized

# Experiment metadata
experiment:
  name: "Paul_EMT_Setting5_LabelShuffled"
  description: "Label-shuffled experiment - randomize time labels on intermediate timepoints (T1-T6)"
  version: "1.0"
  author: "Shi Pan"
  date: "2024-12-16"
  experiment_type: "label_shuffled"

# Configuration file references
configs:
  data: "data_Paul_EMT.yaml"
  models: "models_default.yaml"
  analyzer: "analyzer_default.yaml"

# Data setting selection
data_setting: "setting5_label_shuffled"

# Data sampling override
data_sampling_override:
  total_cells: 1200  # Same as Setting 2 for comparison
  
  # Boundary timepoints to keep
  start_timepoint: "T0"
  end_timepoint: "T7"
  
  # Intermediate timepoints to shuffle: T1, T2, T3, T4, T5, T6
  shuffle_seed: 42

# Models to train (same as Setting 2)
models_to_train:
  - name: "sb_mlplus"
    enabled: true
    override_params:
      training:
        epochs: 200
        batch_size: 64
  
  - name: "batch_ot"
    enabled: true
    override_params:
      training:
        epochs: 150
        batch_size: 64
  
  - name: "vae"
    enabled: true
    override_params:
      training:
        epochs: 150
        batch_size: 64

# Experiment-specific settings
settings:
  seed: 42
  device: "cuda"
  
  multi_gpu:
    enabled: false
  
  num_workers: 4
  
  mixed_precision:
    enabled: false
  
  output_dir: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/SynthaticSCData/Paul_Setting5_LabelShuffled"
  
  subdirs:
    checkpoints: "checkpoints"
    logs: "logs"
    visualizations: "visualizations"
    metrics: "metrics"
    generated_data: "generated_data"
  
  logging:
    console_level: "INFO"
    file_level: "DEBUG"
    log_file: "experiment.log"
    
    wandb:
      enabled: false
    
    tensorboard:
      enabled: true
      log_dir: "tensorboard"
  
  checkpoint:
    save_frequency: 10
    keep_last_n: 3
    save_best: true
    save_optimizer: true
    save_scheduler: true

# Evaluation settings
evaluation:
  eval_during_training: true
  eval_frequency: 5
  eval_on_test: true
  
  compute_metrics: true
  generate_visualizations: true
  save_generated_samples: true
  
  n_samples_per_model: 500
  
  # Evaluation endpoints (use true labels)
  start_timepoint: "T0"
  end_timepoint: "T7"
  
  trajectory:
    n_intermediate_points: 20
    save_full_trajectory: true
    analyze_per_segment: true

# Post-training analysis
post_analysis:
  enabled: true
  
  tasks:
    - name: "label_shuffle_analysis"
      description: "Analyze impact of label shuffling on model performance"
      enabled: true
      params:
        reference_setting: "Paul_EMT_Setting2"
        metrics_to_compare:
          - "test_loss"
          - "frechet_distance"
          - "mae"
          - "pcc"
          - "wasserstein_distance"
          - "mmd"
    
    - name: "generate_report"
      description: "Generate comprehensive comparison report"
      enabled: true

# Resource limits
resources:
  max_memory_gb: 16
  max_time_hours: 24

# Error handling
error_handling:
  continue_on_error: false
  save_on_error: true
  send_notification: false
  notification_email: null
