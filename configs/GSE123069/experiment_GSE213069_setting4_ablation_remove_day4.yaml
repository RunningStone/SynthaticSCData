# ============================================================================
# Experiment Configuration: GSE213069 V1 - Ablation Study (Remove day4)
# ============================================================================
# Ablation: Remove day4 timepoint to assess its marginal contribution
# Time axis: T0 → day2 → day3 → day5 (day4 removed)

experiment:
  name: "GSE213069_V1_Setting4_Ablation_RemoveDay4"
  description: "Ablation study: remove day4 timepoint to assess its marginal contribution"
  version: "1.0"
  author: "Shi Pan"
  date: "2024-12-15"
  parent_experiment: "GSE213069_V1_Setting2"
  ablation_target: "day4"

configs:
  data: "data_GSE213069_V1.yaml"
  models: "models_default.yaml"
  analyzer: "analyzer_default.yaml"

data_setting: "setting4_ablation_remove_day4"

data_sampling_override:
  total_cells: 2500
  # Rationale:
  # - Fair comparison: same total samples as Setting2 (2500)
  # - 4 timepoints × 625 = 2500 cells

models_to_train:
  - name: "sb_mlplus"
    enabled: true
    override_params:
      training:
        epochs: 200
        batch_size: 64
        early_stopping_patience: 30

settings:
  seed: 42
  device: "cuda"
  multi_gpu:
    enabled: false
  num_workers: 4
  mixed_precision:
    enabled: false
  
  output_dir: "/home/pan/Experiments/EXPs/2025_10_VCC_Exps/OUTPUTs/GSE213069_V1/Setting4_Ablation_RemoveDay4"
  
  subdirs:
    checkpoints: "checkpoints"
    logs: "logs"
    visualizations: "visualizations"
    metrics: "metrics"
    generated_data: "generated_data"
  
  logging:
    console_level: "INFO"
    file_level: "DEBUG"
    log_file: "experiment.log"
    wandb:
      enabled: false
    tensorboard:
      enabled: true
      log_dir: "tensorboard"
  
  checkpoint:
    save_frequency: 10
    keep_last_n: 3
    save_best: true
    save_optimizer: true
    save_scheduler: true

evaluation:
  eval_during_training: true
  eval_frequency: 5
  eval_on_test: true
  compute_metrics: true
  generate_visualizations: true
  save_generated_samples: true
  n_samples_per_model: 1000
  
  # Evaluation endpoints (always T0 to day5)
  start_timepoint: "T0"
  end_timepoint: "day5"
  
  trajectory:
    n_intermediate_points: 20
    save_full_trajectory: true
    analyze_per_segment: true

post_analysis:
  enabled: true
  tasks:
    - name: "ablation_impact_analysis"
      description: "Analyze the impact of removing day4 timepoint"
      enabled: true
    - name: "generate_report"
      description: "Generate ablation study report"
      enabled: true

resources:
  max_memory_gb: 32
  max_time_hours: 24

error_handling:
  continue_on_error: false
  save_on_error: true
  send_notification: false
  notification_email: null
