[project]
name = "schrodinger-bridge-dataset"
version = "0.2.0"
description = "Continuous time single-cell trajectory generation using Neural ODE"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "torch>=1.10.0",
    "matplotlib>=3.4.0",
    "scikit-learn>=1.0.0",
    "h5py>=3.6.0",
    "pyyaml>=6.0",
    "tqdm>=4.62.0",
    "POT>=0.8.0",
    "torchdiffeq>=0.2.3",
    "scanpy>=1.9.0",
    "anndata>=0.8.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.setuptools]
packages = ["Data", "Model", "Trainer", "Analyser"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["Tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''
